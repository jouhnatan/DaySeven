name: dayseven
description: "DaySeven — a world-building knowledge base editor"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.0+5

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^2.6.1
  file_selector: ^1.1.0
  sqlite3: ^3.5.1
  archive: ^4.1.0
  xml: ^7.0.1
  diff_match_patch: ^0.4.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  crypto: ^3.0.7
  collection: ^1.19.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  msix: ^3.18.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.

flutter:
  uses-material-design: true

  fonts:
    # IBM Plex Sans is the default for application UI and document text.
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Light.ttf
          weight: 300
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-BoldItalic.ttf
          weight: 700
          style: italic
    # Archivo is a variable font (wght axis). Weight is applied per span with
    # FontVariation rather than by registering static weight files.
    - family: Archivo
      fonts:
        - asset: assets/fonts/archivo/Archivo.ttf
        - asset: assets/fonts/archivo/Archivo-Italic.ttf
          style: italic
    # Geist Pixel Square is reserved for headings in application chrome.
    - family: Geist Pixel Square
      fonts:
        - asset: assets/fonts/geist_pixel/GeistPixel-Square.ttf

# Windows packaging. `dart run msix:create` produces the installable package;
# Microsoft's current guidance is MSIX, which installs per-user with no admin
# rights and gets OS-managed updates and uninstall.
msix_config:
  display_name: DaySeven
  publisher_display_name: DaySeven
  identity_name: com.dayseven.dayseven
  # Replace with the subject of your Authenticode certificate before signing;
  # unsigned packages install only with developer mode enabled.
  publisher: CN=DaySeven
  msix_version: 1.3.0.0
  capabilities: internetClient
  install_certificate: false
  # No file-type association: documents are ordinary .md files now, and
  # claiming that extension would make DaySeven the default application for
  # every Markdown file on the machine.
