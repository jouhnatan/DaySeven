name: Build Windows MSIX

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-msix.yml"
      - "env/**"
      - "lib/**"
      - "scripts/build_windows.ps1"
      - "windows/**"
      - "pubspec.lock"
      - "pubspec.yaml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-msix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed x64 installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Write build configuration
        shell: pwsh
        run: |
          Copy-Item env/supabase.production.json env/supabase.json

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Create test signing certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci, dist | Out-Null

          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=DaySeven" `
            -FriendlyName "DaySeven GitHub Actions test certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature `
            -HashAlgorithm SHA256 `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")

          $passwordText = [Guid]::NewGuid().ToString("N")
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $pfxPath = Join-Path $PWD ".ci\dayseven-ci.pfx"

          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $password | Out-Null
          Export-Certificate -Cert $certificate -FilePath "dist\DaySeven-test-certificate.cer" | Out-Null

          "MSIX_CERTIFICATE_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSIX_CERTIFICATE_PASSWORD=$passwordText" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSIX
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Collect installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path build -Filter *.msix -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "The build completed without producing an MSIX file under build/."
          }

          Copy-Item $installer.FullName "dist\DaySeven-Windows-x64.msix"

          @"
          DAYSEVEN TEST INSTALLER

          1. Extract this entire ZIP.
          2. Open PowerShell as Administrator in the extracted folder.
          3. Run:
             Import-Certificate -FilePath .\DaySeven-test-certificate.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople
          4. Double-click DaySeven-Windows-x64.msix and choose Install.

          The certificate is a test certificate generated for this build. Only
          install it when you trust the person who provided this archive.
          "@ | Set-Content -Path "dist\INSTALL.txt" -Encoding utf8

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DaySeven-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
