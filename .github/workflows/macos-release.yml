name: Build macOS release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/macos-release.yml"
      - "env/**"
      - "lib/**"
      - "macos/**"
      - "rust/**"
      - "rust_builder/**"
      - "scripts/build_macos.sh"
      - "scripts/publish_macos.sh"
      - "scripts/pubspec_version.sh"
      - "pubspec.lock"
      - "pubspec.yaml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DMG and update archive
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check the tag matches the pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          source scripts/pubspec_version.sh
          tag="${GITHUB_REF_NAME#v}"

          # The tag names the release; the pubspec decides what the installed
          # app reports. If they disagree the feed advertises a version no
          # running copy will ever compare itself against correctly.
          if [[ "$tag" != "$DS_VERSION_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $DS_VERSION_FULL. Bump 'version:' in pubspec.yaml, or retag." >&2
            exit 1
          fi

          echo "Releasing $DS_VERSION_FULL"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Write build configuration
        run: cp env/supabase.production.json env/supabase.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build DMG and update archive
        run: ./scripts/build_macos.sh

      - name: Publish to Supabase
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENV_FILE: env/supabase.json
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: ./scripts/publish_macos.sh

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: DaySeven-macOS
          path: |
            build/dist/DaySeven.dmg
            build/dist/DaySeven-macos.zip
          if-no-files-found: error
          retention-days: 30
