name: Build Windows release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-release.yml"
      - "env/**"
      - "lib/**"
      - "scripts/build_windows.ps1"
      - "scripts/publish_windows.ps1"
      - "scripts/pubspec_version.ps1"
      - "windows/**"
      - "pubspec.lock"
      - "pubspec.yaml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build x64 archive
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check the tag matches the pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = & .\scripts\pubspec_version.ps1
          $tag = "${{ github.ref_name }}" -replace '^v', ''

          # The tag names the release; the pubspec decides what the installed
          # app reports. If they disagree, the feed advertises a version that
          # no running copy will compare itself against correctly.
          if ($tag -ne $version.Name) {
            throw "Tag ${{ github.ref_name }} does not match pubspec version $($version.Full). Bump `version:` in pubspec.yaml, or retag."
          }

          Write-Host "Releasing $($version.Full)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Write build configuration
        shell: pwsh
        run: Copy-Item env/supabase.production.json env/supabase.json

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Build archive
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Publish to Supabase
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENV_FILE: env/supabase.json
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: .\scripts\publish_windows.ps1

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: DaySeven-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
